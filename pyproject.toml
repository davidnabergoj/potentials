[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "potentials"
dynamic = ["version"]
authors = [
    { name = "David Nabergoj", email = "david.nabergoj@fri.uni-lj.si" },
]
description = "Potential functions for sampling and optimization"
readme = "README.md"
requires-python = ">=3.7"
keywords = [
    "benchmark",
    "probability-distribution",
    "potential",
    "python",
    "pytorch",
    "sampling",
    "machine-learning",
    "generative-modeling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "numpy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/davidnabergoj/potentials"
Issues = "https://github.com/davidnabergoj/potentials/issues"

[tool.setuptools.dynamic]
version = { attr = "potentials._version.__version__" }

[tool.setuptools.packages.find]
include = ["potentials*"]

[tool.setuptools.package-data]
potentials = ["real/data/*", "real/downloaded/*", "true_moments/*"]
